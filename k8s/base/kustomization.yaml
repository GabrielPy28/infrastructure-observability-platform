apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: infrastructure-observability-platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# El generador añade un hash al nombre del ConfigMap: cambiar la configuración
# cambia el pod template y dispara un rolling update automáticamente.
configMapGenerator:
  - name: observability-api-config
    literals:
      - APP_ENV=base
