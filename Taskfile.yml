version: "3"

vars:
  APP_DIR: app
  IMAGE: observability-api
  # SHA del commit; "-dirty" si hay cambios sin commitear (la imagen no es reproducible).
  TAG:
    sh: git describe --always --dirty --abbrev=7
  CLUSTER: devops-platform
  # Contexto explícito en cada kubectl: nunca se opera por accidente sobre otro cluster.
  KUBE_CONTEXT: kind-devops-platform
  ENV: '{{.ENV | default "dev"}}'
  NAMESPACE: observability-{{.ENV}}
  VENV_BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'
  PYTHON: '{{if eq OS "windows"}}py -3{{else}}python3{{end}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- Aplicación ---
  app:install:
    desc: Crea el entorno virtual e instala dependencias de desarrollo
    dir: "{{.APP_DIR}}"
    cmds:
      - "{{.PYTHON}} -m venv .venv"
      - "{{.VENV_BIN}}/python -m pip install -q --upgrade pip"
      - "{{.VENV_BIN}}/python -m pip install -q -r requirements-dev.txt"
    status:
      - test -d .venv

  app:lint:
    desc: Lint y verificación de formato (ruff)
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/ruff check ."
      - "{{.VENV_BIN}}/ruff format --check ."

  app:format:
    desc: Aplica el formato de ruff
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/ruff format ."
      - "{{.VENV_BIN}}/ruff check --fix ."

  app:test:
    desc: Ejecuta los tests
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/python -m pytest"

  app:seed:
    desc: Genera la base de datos local en app/data/infra.db
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/python -m seed.generate --output data/infra.db"

  app:run:
    desc: Ejecuta la API en local con recarga automática (http://localhost:8000/docs)
    dir: "{{.APP_DIR}}"
    deps: [app:seed]
    cmds:
      - "{{.VENV_BIN}}/uvicorn src.main:app --reload --port 8000"

  # --- Docker ---
  docker:build:
    desc: Construye la imagen etiquetada con el SHA del commit actual
    dir: "{{.APP_DIR}}"
    cmds:
      - docker build --build-arg APP_VERSION={{.TAG}} -t {{.IMAGE}}:{{.TAG}} .

  docker:run:
    desc: Ejecuta la imagen como lo hará Kubernetes (solo lectura, no-root)
    deps: [docker:build]
    cmds:
      - docker run --rm --read-only --tmpfs /tmp -p 8000:8000 {{.IMAGE}}:{{.TAG}}

  # --- Kubernetes (Kind) ---
  k8s:cluster:create:
    desc: Crea el cluster Kind del proyecto (en la Fase 3 lo hará Terraform)
    cmds:
      - kind create cluster --name {{.CLUSTER}} --wait 90s
    status:
      - kubectl config get-contexts {{.KUBE_CONTEXT}}

  k8s:cluster:delete:
    desc: Elimina el cluster Kind del proyecto
    cmds:
      - kind delete cluster --name {{.CLUSTER}}

  k8s:load:
    desc: Construye la imagen y la carga en los nodos de Kind
    deps: [docker:build]
    cmds:
      - kind load docker-image {{.IMAGE}}:{{.TAG}} --name {{.CLUSTER}}

  k8s:deploy:
    desc: "Despliega la versión actual en un entorno (task k8s:deploy ENV=dev|prod)"
    deps: [k8s:load]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl --context {{.KUBE_CONTEXT}} apply -f -
      - mkdir -p k8s/.deploy/{{.ENV}}
      - |
        printf '%s\n' \
          'apiVersion: kustomize.config.k8s.io/v1beta1' \
          'kind: Kustomization' \
          'resources:' \
          '  - ../../overlays/{{.ENV}}' \
          'images:' \
          '  - name: {{.IMAGE}}' \
          '    newTag: "{{.TAG}}"' > k8s/.deploy/{{.ENV}}/kustomization.yaml
      - kubectl --context {{.KUBE_CONTEXT}} apply -k k8s/.deploy/{{.ENV}}
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout status deployment/observability-api --timeout=180s

  k8s:status:
    desc: Muestra los recursos de un entorno (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} get deploy,rs,pods,svc,hpa,pdb,cm -o wide

  k8s:history:
    desc: Historial de revisiones del Deployment (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout history deployment/observability-api

  k8s:port-forward:
    desc: Expone la API en http://localhost:8080 (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} port-forward svc/observability-api 8080:80
