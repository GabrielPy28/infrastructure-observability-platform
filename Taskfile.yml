version: "3"

vars:
  APP_DIR: app
  # IMAGE y TAG se pueden sobrescribir (el CD usa la imagen publicada en GHCR):
  #   task k8s:apply IMAGE=ghcr.io/<owner>/observability-api TAG=<sha>
  IMAGE: '{{.IMAGE | default "observability-api"}}'
  # SHA del commit. Con cambios sin commitear en app/ (el contexto de la imagen):
  # <sha>-dirty-<hash del contenido de app/>, calculado con un índice temporal
  # de git (no toca el staging). Dos builds distintos nunca comparten tag; si lo
  # hicieran, Kubernetes no vería cambios en el Deployment y no desplegaría nada.
  GIT_TAG:
    sh: |
      head=$(git rev-parse --short=7 HEAD)
      if [ -z "$(git status --porcelain -- app)" ]; then
        echo "$head"
      else
        export GIT_INDEX_FILE="$(git rev-parse --git-dir)/image-tag.index"
        rm -f "$GIT_INDEX_FILE"
        git -c core.safecrlf=false add -A app
        echo "$head-dirty-$(git rev-parse --short=7 "$(git write-tree)")"
        rm -f "$GIT_INDEX_FILE"
      fi
  TAG: "{{.TAG | default .GIT_TAG}}"
  CLUSTER: devops-platform
  TF_LAYERS: cluster addons envs/dev envs/prod
  TF_LAYERS_REVERSE: envs/prod envs/dev addons cluster
  # El módulo de AWS/EKS se valida pero nunca se aplica (no está en tf:up/tf:down).
  TF_VALIDATE_LAYERS: cluster addons envs/dev envs/prod aws/eks
  # Contexto explícito en cada kubectl: nunca se opera por accidente sobre otro cluster.
  KUBE_CONTEXT: kind-devops-platform
  ENV: '{{.ENV | default "dev"}}'
  NAMESPACE: observability-{{.ENV}}
  VENV_BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'
  PYTHON: '{{if eq OS "windows"}}py -3{{else}}python3{{end}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- Aplicación ---
  app:install:
    desc: Crea el entorno virtual e instala dependencias de desarrollo
    dir: "{{.APP_DIR}}"
    cmds:
      - "{{.PYTHON}} -m venv .venv"
      - "{{.VENV_BIN}}/python -m pip install -q --upgrade pip"
      - "{{.VENV_BIN}}/python -m pip install -q -r requirements-dev.txt"
    status:
      - test -d .venv

  app:lint:
    desc: Lint y verificación de formato (ruff)
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/ruff check ."
      - "{{.VENV_BIN}}/ruff format --check ."

  app:format:
    desc: Aplica el formato de ruff
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/ruff format ."
      - "{{.VENV_BIN}}/ruff check --fix ."

  app:test:
    desc: Ejecuta los tests
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/python -m pytest"

  app:seed:
    desc: Genera la base de datos local en app/data/infra.db
    dir: "{{.APP_DIR}}"
    deps: [app:install]
    cmds:
      - "{{.VENV_BIN}}/python -m seed.generate --output data/infra.db"

  app:run:
    desc: Ejecuta la API en local con recarga automática (http://localhost:8000/docs)
    dir: "{{.APP_DIR}}"
    deps: [app:seed]
    cmds:
      - "{{.VENV_BIN}}/uvicorn src.main:app --reload --port 8000"

  # --- Docker ---
  docker:build:
    desc: Construye la imagen etiquetada con el SHA del commit actual
    dir: "{{.APP_DIR}}"
    cmds:
      - docker build --build-arg APP_VERSION={{.TAG}} -t {{.IMAGE}}:{{.TAG}} .

  docker:run:
    desc: Ejecuta la imagen como lo hará Kubernetes (solo lectura, no-root)
    deps: [docker:build]
    cmds:
      - docker run --rm --read-only --tmpfs /tmp -p 8000:8000 {{.IMAGE}}:{{.TAG}}

  # --- Terraform ---
  # Orden de las capas: cluster -> addons -> entornos. Cada una tiene su propio state.
  tf:fmt:
    desc: Formatea todo el código Terraform
    cmds:
      - terraform fmt -recursive terraform

  tf:validate:
    desc: Verifica formato y valida todas las capas (sin tocar ningún state)
    cmds:
      - terraform fmt -recursive -check terraform
      - for: { var: TF_VALIDATE_LAYERS }
        cmd: terraform -chdir=terraform/{{.ITEM}} init -input=false -backend=false > /dev/null && terraform -chdir=terraform/{{.ITEM}} validate

  tf:plan:
    desc: "Muestra el plan de una capa (task tf:plan LAYER=cluster|addons|envs/dev|envs/prod)"
    requires: { vars: [LAYER] }
    cmds:
      - terraform -chdir=terraform/{{.LAYER}} init -input=false > /dev/null
      - terraform -chdir=terraform/{{.LAYER}} plan

  tf:apply:
    desc: "Aplica una capa (task tf:apply LAYER=...); pide confirmación"
    requires: { vars: [LAYER] }
    interactive: true
    cmds:
      - terraform -chdir=terraform/{{.LAYER}} init -input=false > /dev/null
      - terraform -chdir=terraform/{{.LAYER}} apply {{.CLI_ARGS}}

  tf:destroy:
    desc: "Destruye una capa (task tf:destroy LAYER=...); pide confirmación"
    requires: { vars: [LAYER] }
    interactive: true
    cmds:
      - terraform -chdir=terraform/{{.LAYER}} destroy {{.CLI_ARGS}}

  tf:up:
    desc: "Crea toda la plataforma en orden (añade '-- -auto-approve' para no confirmar)"
    cmds:
      - for: { var: TF_LAYERS }
        task: tf:apply
        vars: { LAYER: "{{.ITEM}}" }

  tf:down:
    desc: "Destruye toda la plataforma en orden inverso (añade '-- -auto-approve' para no confirmar)"
    cmds:
      - for: { var: TF_LAYERS_REVERSE }
        task: tf:destroy
        vars: { LAYER: "{{.ITEM}}" }

  # --- Kubernetes (aplicación) ---
  k8s:load:
    desc: Construye la imagen y la carga en los nodos de Kind
    deps: [docker:build]
    cmds:
      - kind load docker-image {{.IMAGE}}:{{.TAG}} --name {{.CLUSTER}}

  k8s:deploy:
    desc: "Construye, carga en Kind y despliega la versión actual (task k8s:deploy ENV=dev|prod)"
    deps: [k8s:load]
    cmds:
      - task: k8s:apply

  k8s:apply:
    desc: "Despliega IMAGE:TAG sin construir; si el rollout falla, revierte a la revisión anterior"
    preconditions:
      - sh: kubectl --context {{.KUBE_CONTEXT}} get namespace {{.NAMESPACE}}
        msg: "El namespace {{.NAMESPACE}} no existe. Créalo con: task tf:apply LAYER=envs/{{.ENV}}"
    cmds:
      - mkdir -p k8s/.deploy/{{.ENV}}
      - |
        printf '%s\n' \
          'apiVersion: kustomize.config.k8s.io/v1beta1' \
          'kind: Kustomization' \
          'resources:' \
          '  - ../../overlays/{{.ENV}}' \
          'images:' \
          '  - name: observability-api' \
          '    newName: {{.IMAGE}}' \
          '    newTag: "{{.TAG}}"' > k8s/.deploy/{{.ENV}}/kustomization.yaml
      - kubectl --context {{.KUBE_CONTEXT}} apply -k k8s/.deploy/{{.ENV}}
      - |
        kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout status deployment/observability-api --timeout=180s || {
          echo "Rollout fallido: revirtiendo a la revisión anterior"
          kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout undo deployment/observability-api
          kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout status deployment/observability-api --timeout=180s
          exit 1
        }

  k8s:smoke:
    desc: "Smoke test del entorno: salud, versión desplegada, API key y datos (ENV=dev|prod)"
    cmds:
      - "{{.PYTHON}} scripts/smoke_test.py --env {{.ENV}} --context {{.KUBE_CONTEXT}} --expected-version {{.TAG}}"

  k8s:status:
    desc: Muestra los recursos de un entorno (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} get deploy,rs,pods,svc,hpa,pdb,cm -o wide

  k8s:history:
    desc: Historial de revisiones del Deployment (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} rollout history deployment/observability-api

  k8s:port-forward:
    desc: Expone la API en http://localhost:8080 (ENV=dev|prod)
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NAMESPACE}} port-forward svc/observability-api 8080:80

  k8s:api-key:
    desc: Muestra la API key del entorno (generada por Terraform) (ENV=dev|prod)
    cmds:
      - terraform -chdir=terraform/envs/{{.ENV}} output -raw api_key
    silent: true

  # --- Escenarios de resiliencia (entorno prod) ---
  scenario:healthy:
    desc: "Escenario 1: despliegue sano (réplicas, reparto entre nodos, disponibilidad)"
    cmds:
      - "{{.PYTHON}} scripts/scenarios/healthy.py"

  scenario:pod-failure:
    desc: "Escenario 2: eliminación de un pod y drain de un nodo sin pérdida de servicio"
    cmds:
      - "{{.PYTHON}} scripts/scenarios/pod_failure.py"

  scenario:bad-deploy:
    desc: "Escenario 3: despliegue defectuoso, rollout detenido y rollback"
    cmds:
      - "{{.PYTHON}} scripts/scenarios/bad_deploy.py"

  scenario:autoscaling:
    desc: "Escenario 4: autoescalado del HPA bajo carga generada con k6"
    cmds:
      - "{{.PYTHON}} scripts/scenarios/autoscaling.py"

  scenario:all:
    desc: Ejecuta los cuatro escenarios en orden
    cmds:
      - task: scenario:healthy
      - task: scenario:pod-failure
      - task: scenario:bad-deploy
      - task: scenario:autoscaling
